<html>
<head>
    <title>ML Project Home</title>
</head>
<body>
    <div class="login">
        <h1>Student Exam Performance Predictor</h1>
        <form action="{{url_for('predict')}}" method="post">
            <legend>Student Exam Performance Predictor</legend>
        <div class="mb-3">
            <label class="form-label">Gender:</label>
            <select name="gender" required>
                <option selected disabled value="">Select Gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Race/Ethnicity:</label>
            <select name="race_ethnicity" required>
                <option selected disabled value="">Select Race/Ethnicity</option>
                <option value="group A">group A</option>
                <option value="group B">group B</option>
                <option value="group C">group C</option>
                <option value="group D">group D</option>
                <option value="group E">group E</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Parental Level of Education:</label>
            <select name="parental_level_of_education" required>
                <option selected disabled value="">Select Parental Level of Education</option>
                <option value="Some High School">Some High School</option>
                <option value="High School">High School</option>
                <option value="Some College">Some College</option>
                <option value="Associate's Degree">Associate's Degree</option>
                <option value="Bachelor's Degree">Bachelor's Degree</option>
                <option value="Master's Degree">Master's Degree</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Lunch:</label>
            <select name="lunch" required>
                <option selected disabled value="">Select Lunch</option>
                <option value="Standard">Standard</option>
                <option value="Free/Reduced">Free/Reduced</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Test Preparation Course:</label>
            <select name="test_preparation_course" required>    
                <option selected disabled value="">Select Test Preparation Course</option>
                <option value="None">None</option>
                <option value="Completed">Completed</option>        
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">
                Reading Score:
            </label>
            <input type="number" name="reading_score" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">
                Writing Score:  
            </label>
            <input type="number" name="writing_score" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary">Predict</button>    
        </form>
    </div>
   <h2>
    {% if results %}
        Predicted Math Score: {{ results}}
    {% endif %}
   </h2>
</html>
